name: Build e testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java 17 / Maven
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar e testar
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
