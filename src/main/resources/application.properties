spring.application.name=gestao-inventario
server.port=${PORT:8081}
management.endpoints.web.exposure.include=health
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestao_inventario}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/001_categoria.sql,classpath:db/002_categoria_nome_unico.sql,classpath:db/003_inventario.sql
