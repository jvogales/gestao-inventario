<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: cabecalho('Registrar baixa')}"></head>
<body>
<header th:replace="~{layout :: navegacao}"></header>
<main id="conteudo">

<a class="voltar" th:href="@{/inventario/{id}(id=${equipamento.id})}">← Detalhes do equipamento</a>
<h1>Registrar baixa</h1>
<p th:text="${equipamento.identificacao + ' · ' + equipamento.numeroPatrimonio}"></p>
<p class="aviso">A baixa é definitiva. O equipamento ficará disponível para consulta com seus históricos.</p>
<form class="painel formulario" method="post" th:action="@{/inventario/{id}/baixar(id=${equipamento.id})}" th:object="${dados}" novalidate>
    <div th:replace="~{layout :: validacao}"></div>

    <label>Data da baixa<input th:field="*{data}" th:attr="aria-invalid=${#fields.hasErrors('data')},aria-describedby=${#fields.hasErrors('data') ? 'erro-data' : null}" type="date" required><small class="erro" th:if="${#fields.hasErrors('data')}" th:id="'erro-data'" th:errors="*{data}"></small></label>
    <label>Motivo<input th:field="*{motivo}" th:attr="aria-invalid=${#fields.hasErrors('motivo')},aria-describedby=${#fields.hasErrors('motivo') ? 'erro-motivo' : null}" required><small class="erro" th:if="${#fields.hasErrors('motivo')}" th:id="'erro-motivo'" th:errors="*{motivo}"></small></label>
    <label>Observação<textarea th:field="*{observacao}" th:attr="aria-invalid=${#fields.hasErrors('observacao')},aria-describedby=${#fields.hasErrors('observacao') ? 'erro-observacao' : null}" rows="3"></textarea><small class="erro" th:if="${#fields.hasErrors('observacao')}" th:id="'erro-observacao'" th:errors="*{observacao}"></small></label>
    <div class="acoes"><button class="botao-perigo">Confirmar baixa</button><a class="secundario" th:href="@{/inventario/{id}(id=${equipamento.id})}">Cancelar</a></div>
</form>
</main>
</body>
</html>
