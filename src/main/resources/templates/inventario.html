<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: cabecalho('Equipamentos')}"></head>
<body>
<header th:replace="~{layout :: navegacao}"></header>
<main id="conteudo">

<div class="titulo">
    <h1>Equipamentos</h1>
    <a class="botao" th:href="@{/inventario/novo}">Cadastrar equipamento</a>
</div>
<form class="painel filtros" method="get" th:action="@{/}">
    <label>Patrimônio ou identificação<input name="pesquisa" type="search" th:value="${pesquisa}"></label>
    <label>Categoria<select name="categoriaId">
        <option value="">Todas</option>
        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}" th:selected="${c.id == categoriaId}"></option>
    </select></label>
    <label>Localização<select name="localizacaoId">
        <option value="">Todas</option>
        <option th:each="l : ${locais}" th:value="${l.id}" th:text="${l.bloco + ' / ' + l.local}" th:selected="${l.id == localizacaoId}"></option>
    </select></label>
    <label>Estado<select name="estado">
        <option value="">Todos</option>
        <option th:each="e : ${estados}" th:value="${e}" th:text="#{${'estado.' + e}}" th:selected="${e == estado}"></option>
    </select></label>
    <div class="acoes"><button>Filtrar</button><a class="secundario" th:href="@{/}">Limpar filtros</a></div>
</form>
<p class="painel vazio" th:if="${equipamentos.empty}">Nenhum equipamento encontrado.</p>
<div class="tabela painel" th:unless="${equipamentos.empty}" tabindex="0" role="region" aria-label="Lista de equipamentos">
    <table>
        <thead><tr><th scope="col">Patrimônio</th><th scope="col">Identificação</th><th scope="col">Categoria</th><th scope="col">Localização</th><th scope="col">Estado</th></tr></thead>
        <tbody><tr th:each="e : ${equipamentos}">
            <td><a class="patrimonio" th:href="@{/inventario/{id}(id=${e.id})}" th:text="${e.numeroPatrimonio}"></a></td>
            <td th:text="${e.identificacao}"></td><td th:text="${e.categoria.nome}"></td>
            <td th:text="${e.localizacaoAtual.bloco + ' / ' + e.localizacaoAtual.local}"></td>
            <td><span class="estado" th:attr="data-estado=${e.estado}" th:text="#{${'estado.' + e.estado}}"></span></td>
        </tr></tbody>
    </table>
</div>
</main>
</body>
</html>
